name: Validate GameBuddy

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate Harness contract
        run: npm run harness:validate-all

      - name: Smoke test replay WebSocket
        run: npm run harness:smoke

      - name: Smoke test lifecycle events
        run: npm run harness:smoke:lifecycle
