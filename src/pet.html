<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameBuddy Pet</title>
    <link rel="stylesheet" href="./pet.css?v=bubble-refresh" />
  </head>
  <body>
    <main class="pet-stage" id="pet-stage" data-pose="waiting">
      <aside class="card-recommendation" id="card-recommendation" aria-live="polite">
        <div class="card-head">
          <span class="card-mark" id="card-mark" aria-hidden="true">牌</span>
          <div class="card-heading"><span class="card-kicker" id="card-kicker">选牌建议</span><h1 id="card-title">拿哪张牌</h1></div>
          <button class="card-close" id="card-close" type="button" aria-label="收起建议详情" title="收起建议详情">×</button>
        </div>
        <div class="card-details" id="card-details" hidden>
          <div class="card-scroll">
            <section class="card-reason-block">
              <span>判断依据</span>
              <p class="card-reason" id="card-reason"></p>
            </section>
            <div class="card-points" id="card-points"></div>
          </div>
          <div class="card-meta" id="card-meta"></div>
        </div>
      </aside>
      <aside class="encounter-guide" id="encounter-guide" aria-live="polite">
        <div class="guide-head">
          <div><span class="guide-kicker" id="guide-kicker">精英攻略</span><h1 id="guide-title">敌人机制</h1></div>
          <button class="guide-close" id="guide-close" aria-label="关闭本场攻略">×</button>
        </div>
        <div class="guide-scroll" id="guide-content"></div>
        <div class="guide-source" id="guide-source">数据来源：Spire Codex</div>
      </aside>
      <button class="speech visible" id="speech" type="button" aria-label="打开 GameBuddy 主面板">
        <span class="speech-text" id="speech-text">正在连接游戏</span>
        <span class="speech-chevron" aria-hidden="true"></span>
      </button>
      <button class="pet-button" id="pet-button" aria-label="打开 GameBuddy 建议面板">
        <span class="thinking-cloud" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="thinking-orbit" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="pet-glow"></span>
        <span class="pet-sprite" id="pet-sprite" aria-hidden="true"></span>
        <span class="pet-body">
          <span class="pet-ear left"></span><span class="pet-ear right"></span>
          <span class="pet-face"><span class="pet-brow left"></span><span class="pet-brow right"></span><span class="eye left"></span><span class="eye right"></span><span class="pet-mouth"></span></span>
          <span class="pet-paw" aria-hidden="true"></span>
          <span class="pet-scarf"></span><span class="pet-foot left"></span><span class="pet-foot right"></span>
        </span>
        <span class="pet-shadow"></span>
      </button>
      <div class="pet-status" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="pet-status-label">未连接</span><span class="thinking-time" id="thinking-time" title="本次 LLM 思考用时" hidden>0.0 秒</span><button class="thinking-toggle" id="thinking-toggle" type="button" title="配置 API Key 后可开启思考模式；当前使用本地规则建议" disabled>思考模式：关</button></div>
    </main>
    <script src="./pet-sprite/index.js?v=bubble-refresh"></script>
    <script src="./pet.js?v=bubble-refresh"></script>
  </body>
</html>
