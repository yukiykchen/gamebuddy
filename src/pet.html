<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameBuddy Pet</title>
    <link rel="stylesheet" href="./pet.css?v=status-strip" />
  </head>
  <body>
    <main class="pet-stage" id="pet-stage" data-pose="waiting">
      <aside class="card-recommendation" id="card-recommendation" aria-live="polite">
        <div class="card-head">
          <div><span class="card-kicker" id="card-kicker">卡牌奖励建议</span><h1 id="card-title">推荐拿取</h1></div>
          <button class="card-close" id="card-close" aria-label="关闭当前建议">×</button>
        </div>
        <div class="card-scroll">
          <p class="card-reason" id="card-reason"></p>
          <div class="card-points" id="card-points"></div>
        </div>
        <div class="card-meta" id="card-meta"></div>
      </aside>
      <aside class="encounter-guide" id="encounter-guide" aria-live="polite">
        <div class="guide-head">
          <div><span class="guide-kicker" id="guide-kicker">精英攻略</span><h1 id="guide-title">敌人机制</h1></div>
          <button class="guide-close" id="guide-close" aria-label="关闭本场攻略">×</button>
        </div>
        <div class="guide-scroll" id="guide-content"></div>
        <div class="guide-source" id="guide-source">数据来源：Spire Codex</div>
      </aside>
      <button class="pet-button" id="pet-button" aria-label="打开 GameBuddy 建议面板">
        <span class="speech" id="speech">等你出牌</span>
        <span class="thinking-cloud" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="thinking-orbit" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="pet-glow"></span>
        <span class="pet-body">
          <span class="pet-ear left"></span><span class="pet-ear right"></span>
          <span class="pet-face"><span class="pet-brow left"></span><span class="pet-brow right"></span><span class="eye left"></span><span class="eye right"></span><span class="pet-mouth"></span></span>
          <span class="pet-paw" aria-hidden="true"></span>
          <span class="pet-scarf"></span><span class="pet-foot left"></span><span class="pet-foot right"></span>
        </span>
        <span class="pet-shadow"></span>
        <span class="pet-status"><span class="status-dot"></span><span id="pet-status-label">等待游戏 · 等待</span><button class="thinking-toggle" id="thinking-toggle" type="button">思考 开</button></span>
      </button>
    </main>
    <script src="./pet.js?v=short-speech"></script>
  </body>
</html>
